<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myanmar AI Video Studio</title>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: #131a26;
      --panel-2: #1b2434;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Pyidaungsu", "Noto Sans Myanmar", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin-bottom: 14px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: 0.9rem; color: var(--muted); margin-top: 10px; margin-bottom: 6px; }
    input[type="file"], textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-family: inherit;
      font-size: 0.92rem;
    }
    textarea { min-height: 100px; resize: vertical; }
    button {
      margin-top: 12px;
      background: var(--accent);
      color: #052e16;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }
    .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
    .thumb {
      width: 96px; height: 96px; object-fit: cover;
      border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2);
    }
    pre {
      background: #070b12;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow-x: auto;
      font-size: 0.85rem;
      color: #bae6fd;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Myanmar AI Video Studio</h1>

    <div class="card">
      <label for="charFile">ဇာတ်ကောင်ပုံ ရွေးပါ</label>
      <input type="file" id="charFile" accept="image/*" />
      <div class="row">
        <img id="charImg" class="thumb" alt="Character Preview" />
        <span id="charInfo" style="color: var(--muted); font-size: 0.88rem;">ဇာတ်ကောင်ပုံ မရွေးရသေးပါ။</span>
      </div>

      <label for="scriptBox">မြန်မာစာ Script / ဇာတ်လမ်း</label>
      <textarea id="scriptBox">ဇာတ်ကောင် အပြင်ကို ထွက်ပြီး လမ်းလျှောက်သွားတယ်။</textarea>

      <button id="sendBtn">Server သို့ ပို့ပြီး စမ်းသပ်မည်</button>
      <pre id="outBox">Response ဒီမှာ ပေါ်လာပါမည်။</pre>
    </div>
  </div>

  <script>
    const charFile = document.getElementById("charFile");
    const charImg = document.getElementById("charImg");
    const charInfo = document.getElementById("charInfo");
    const scriptBox = document.getElementById("scriptBox");
    const sendBtn = document.getElementById("sendBtn");
    const outBox = document.getElementById("outBox");

    let charDataUrl = "";

    charFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        charDataUrl = reader.result;
        charImg.src = charDataUrl;
        charInfo.textContent = `ရွေးပြီးပါပြီ: ${file.name}`;
      };
      reader.readAsDataURL(file);
    });

    sendBtn.addEventListener("click", async () => {
      outBox.textContent = "Server သို့ ပို့နေပါသည်...";
      try {
        const res = await fetch("/api/render-plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            script: scriptBox.value.trim(),
            motionPrompt: `Keep character from image. Action matching: ${scriptBox.value.trim()}`,
            hasCharacterImage: Boolean(charDataUrl)
          })
        });
        const data = await res.json();
        outBox.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        outBox.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
