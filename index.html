<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Myanmar AI Video Maker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117;
      color: #f3f4f6;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #181b24;
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #2a2f3d;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 20px;
      color: #ffffff;
    }
    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
    }
    textarea, input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #333a4d;
      background: #0f1117;
      color: #ffffff;
      font-size: 14px;
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    .preview-box {
      margin-top: 10px;
      text-align: center;
    }
    .preview-box img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 10px;
      display: none;
      border: 1px solid #333a4d;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 160px;
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-audio {
      background: #2563eb;
      color: #fff;
    }
    .btn-video {
      background: #16a34a;
      color: #fff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #11141c;
      border: 1px solid #2a2f3d;
      font-size: 13px;
      color: #93c5fd;
      min-height: 40px;
    }
    .media-output {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    audio, video {
      width: 100%;
      border-radius: 10px;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Myanmar AI Video Maker</h1>

    <label for="charImage">၁။ ဇာတ်ကောင်ပုံ ရွေးပါ</label>
    <input type="file" id="charImage" accept="image/*" />
    <div class="preview-box">
      <img id="imgPreview" alt="Character Preview" />
    </div>

    <label for="scriptText">၂။ မြန်မာစာ Script ရိုက်ထည့်ပါ</label>
    <textarea id="scriptText" placeholder="ဥပမာ - မင်္ဂလာပါ၊ ကျွန်တော်တို့ရဲ့ ဇာတ်လမ်းလေးကို အခု စတင်ပါတော့မယ်။"></textarea>

    <div class="btn-row">
      <button type="button" class="btn-audio" id="btnAudio">မြန်မာအသံ (MP3) ထုတ်မည်</button>
      <button type="button" class="btn-video" id="btnVideo">Video + Voice ပေါင်းထုတ်မည်</button>
    </div>

    <div class="status" id="statusBox">အဆင်သင့် ဖြစ်ပါပြီ။ (Card / API Key မလိုပါ)</div>

    <div class="media-output">
      <audio id="audioPlayer" controls style="display:none;"></audio>
      <video id="videoPlayer" controls style="display:none;"></video>
    </div>
  </div>

  <script>
    const charImageInput = document.getElementById("charImage");
    const imgPreview = document.getElementById("imgPreview");
    const scriptText = document.getElementById("scriptText");
    const btnAudio = document.getElementById("btnAudio");
    const btnVideo = document.getElementById("btnVideo");
    const statusBox = document.getElementById("statusBox");
    const audioPlayer = document.getElementById("audioPlayer");
    const videoPlayer = document.getElementById("videoPlayer");

    let selectedImageBase64 = "";

    charImageInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        selectedImageBase64 = reader.result;
        imgPreview.src = selectedImageBase64;
        imgPreview.style.display = "inline-block";
      };
      reader.readAsDataURL(file);
    });

    function setBusy(busy, msg) {
      btnAudio.disabled = busy;
      btnVideo.disabled = busy;
      statusBox.textContent = msg;
    }

    btnAudio.addEventListener("click", async () => {
      const text = scriptText.value.trim();
      if (!text) {
        statusBox.textContent = "မြန်မာစာ script အရင် ရိုက်ထည့်ပါ။";
        return;
      }

      try {
        setBusy(true, "မြန်မာအသံ (.mp3) ထုတ်နေပါတယ်...");
        const res = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || "TTS ချိတ်ဆက်မှု မအောင်မြင်ပါ။");
        }

        const blob = await res.blob();
        audioPlayer.src = URL.createObjectURL(blob);
        audioPlayer.style.display = "block";
        setBusy(false, "မြန်မာအသံ ထွက်လာပါပြီ — နားထောင်ကြည့်လို့ ရပါပြီ။");
      } catch (err) {
        setBusy(false, "Error: " + err.message);
      }
    });

    btnVideo.addEventListener("click", async () => {
      const text = scriptText.value.trim();
      if (!selectedImageBase64) {
        statusBox.textContent = "ဇာတ်ကောင်ပုံ တစ်ပုံ အရင် ရွေးပေးပါ။";
        return;
      }
      if (!text) {
        statusBox.textContent = "မြန်မာစာ script အရင် ရိုက်ထည့်ပါ။";
        return;
      }

      try {
        setBusy(true, "ဇာတ်ကောင်ပုံ + မြန်မာအသံ ပေါင်းပြီး Video (.mp4) ထုတ်နေပါတယ်...");
        const res = await fetch("/api/merge-video", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text,
            imageBase64: selectedImageBase64
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || "Video ပေါင်းစပ်မှု မအောင်မြင်ပါ။");
        }

        const blob = await res.blob();
        videoPlayer.src = URL.createObjectURL(blob);
        videoPlayer.style.display = "block";
        setBusy(false, "Video + မြန်မာအသံ ပေါင်းစပ်ပြီးပါပြီ — ကြည့်လို့ ရပါပြီ။");
      } catch (err) {
        setBusy(false, "Error: " + err.message);
      }
    });
  </script>
</body>
</html>
